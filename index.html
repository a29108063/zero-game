<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股散戶模擬器 - 全台最真實的韭菜生存挑戰</title>
  <meta name="description" content="體驗最刺激的台股散戶模擬器！生死決策、當沖融資、盤後戰術擬定、隨機散戶故事！">
  
  <style>
    * { box-sizing: border-box; }
    body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, monospace; padding: 20px; margin: 0; }
    
    .layout-container { display: flex; gap: 20px; max-width: 1050px; margin: 0 auto; align-items: stretch; }
    
    .sidebar { width: 320px; flex-shrink: 0; background: #1e1e1e; border: 2px solid #333; border-radius: 8px; padding: 15px; height: 650px; display: flex; flex-direction: column; }
    .sidebar-title { font-size: 1rem; font-weight: bold; border-bottom: 2px solid #444; padding-bottom: 8px; margin-bottom: 10px; color: #ffd54f; display: flex; justify-content: space-between; align-items: center; }
    .tab-btn { background: #333; color: #fff; border: 1px solid #555; padding: 4px 10px; cursor: pointer; border-radius: 4px; font-size: 0.8rem; }
    .tab-btn.active { background: #ff9800; color: #000; font-weight: bold; border-color: #ff9800; }
    .sidebar-content { flex: 1; overflow-y: auto; padding-right: 5px; }
    
    .history-card { background: #282a36; border: 1px solid #44475a; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 0.85rem; }
    .history-card .day-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; }
    
    .leaderboard-item { display: flex; justify-content: space-between; background: #252526; padding: 10px; border-radius: 4px; margin-bottom: 6px; font-size: 0.85rem; border-left: 4px solid #ff9800; }

    .terminal { flex: 1; border: 2px solid #333; border-radius: 8px; padding: 20px; background-color: #1e1e1e; box-shadow: 0 0 15px rgba(0,0,0,0.8); height: 650px; display: flex; flex-direction: column; }
    
    .app-header { border-bottom: 2px solid #444; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .app-title { margin: 0; color: #00e676; font-size: 1.3rem; font-weight: bold; letter-spacing: 1px; }
    
    .author-badge { font-size: 0.85rem; color: #ffd54f; font-weight: bold; background: #2a2a2a; border: 1px solid #ffd54f; padding: 2px 8px; border-radius: 4px; }

    .timer { font-size: 1.4rem; color: #ff5252; font-weight: bold; text-align: center; margin-bottom: 12px; border: 1px dashed #ff5252; padding: 6px; border-radius: 4px; background: rgba(255, 82, 82, 0.05); }
    .status-bar { display: flex; justify-content: space-between; background: #2a2a2a; padding: 10px; margin-bottom: 10px; border-radius: 4px; font-size: 0.9rem; flex-wrap: wrap; gap: 6px; }
    .title-row { margin-bottom: 12px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
    .title-badge { background: #ff9800; color: #121212; font-weight: bold; padding: 2px 8px; border-radius: 4px; font-size: 0.85rem; display: inline-block; }
    
    .market-info { background: #282a36; border: 1px solid #44475a; padding: 10px; border-radius: 4px; margin-bottom: 12px; display: flex; justify-content: space-between; font-size: 0.9rem; }
    .global-market-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; background: #181920; border: 1px solid #333; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; }
    .market-card { background: #222430; padding: 6px 10px; border-radius: 4px; border: 1px solid #3a3f58; }
    .market-card .title { color: #8be9fd; font-weight: bold; margin-bottom: 2px; }

    .news { background: #252526; border-left: 4px solid #00e676; padding: 10px; margin-bottom: 12px; font-size: 0.9rem; line-height: 1.4; }
    .story-box { background: #2a1b1b; border: 1px dashed #ff5252; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; line-height: 1.5; color: #ffccbc; }
    .dividend-box { background: #1b2a1b; border: 1px dashed #00e676; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.9rem; color: #a5d6a7; }
    
    .btn { display: block; width: 100%; padding: 11px; margin: 6px 0; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; text-align: left; font-size: 0.88rem; transition: background 0.2s; line-height: 1.4; }
    .btn:hover { background: #444; border-color: #888; }
    .btn-next { background: #2e7d32; text-align: center; font-weight: bold; font-size: 1.05rem; margin-top: 12px; border-color: #388e3c; }
    .btn-next:hover { background: #388e3c; }
    .btn-danger { background: #c62828; text-align: center; font-weight: bold; border-color: #e53935; }
    .btn-danger:hover { background: #d32f2f; }
    .red { color: #ff5252; font-weight: bold; }
    .green { color: #69f0ae; font-weight: bold; }
    .log-box { background: #111; padding: 10px; border-radius: 4px; font-size: 0.85rem; margin-top: 10px; max-height: 150px; overflow-y: auto; line-height: 1.6; }
    input[type="text"] { width: 100%; padding: 8px; margin: 8px 0; background: #222; border: 1px solid #555; color: #fff; border-radius: 4px; font-size: 0.9rem; }
    
    .content-body { flex: 1; overflow-y: auto; }

    @media (max-width: 768px) {
      .layout-container { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 300px; }
      .terminal { height: auto; min-height: 500px; }
      .global-market-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="layout-container">
  <div class="sidebar">
    <div class="sidebar-title">
      <span id="sidebar-tab-title">📜 每日對帳歷史</span>
      <div>
        <button class="tab-btn active" id="btn-tab-history" onclick="switchTab('history')">歷史</button>
        <button class="tab-btn" id="btn-tab-leaderboard" onclick="switchTab('leaderboard')">排行榜</button>
      </div>
    </div>
    <div class="sidebar-content" id="sidebar-content"></div>
  </div>

  <div class="terminal">
    <div class="app-header">
      <div class="header-left">
        <h2 class="app-title">📟 台股散戶模擬器</h2>
      </div>
      <div class="header-right">
        <span class="author-badge">✍️ 作者：洪大大</span>
      </div>
    </div>

    <div id="timer-box" class="timer" style="display:none;">⏱️ 決策倒數：<span id="timer-sec">10</span> 秒</div>
    
    <div class="status-bar">
      <div>💰 總資產: $<span id="assets">1,000,000</span></div>
      <div>📈 加權指數: <span id="taiex-hud">40,000</span></div>
      <div>📦 持股: <span id="shares">0</span> 股</div>
      <div>🧠 HP: <span id="hp">100</span>%</div>
      <div>📅 Day <span id="day">1</span></div>
    </div>
    <div class="title-row">
      <span>🏷️ 當前稱號：</span>
      <span id="title-badge" class="title-badge">【台股新星散戶】</span>
    </div>

    <div id="content-area" class="content-body"></div>
  </div>
</div>

<script>
  const environments = [
    { name: '【牛市狂歡】', type: 'up', news: '美股科技股大漲，外資強勢歸隊，台股跳空開高衝刺！' },
    { name: '【熊市反彈】', type: 'down', news: '美股暴跌震盪，台股開盤重挫，散戶恐慌殺出！' },
    { name: '【高檔震盪】', type: 'up', news: '多空交戰劇烈，台積電狹幅平盤震盪，方向不明。' },
    { name: '【主力洗盤】', type: 'down', news: '早盤急拉後遭外資拋售，甩轎力道極強！' },
    { name: '【黑天鵝降臨】', type: 'down', news: '地緣政治風險驟增，夜盤期貨跌停，台股跳空開低爆量下殺！' },
    { name: '【護國神山拉盤】', type: 'up', news: '台積電法說會震撼市場！利多連發領軍大漲，拉抬加權指數大噴發！' },
    { name: '【國安基金進場】', type: 'up', news: '政府基金宣佈護盤，低檔護盤買單狂湧，絕地反彈震撼空頭！' },
    { name: '【量縮死寂盤】', type: 'down', news: '觀望氣氛極濃，預期美聯準會開會，市場成交量創歷史新低，上下震盪極小。' },
    { name: '【妖股狂飆】', type: 'up', news: '中小型股與概念股無序飆漲！漲停板家數破百，市場投機氣氛達到頂點！' },
    { name: '【長假前拋售潮】', type: 'down', news: '連假將至，丙種資金結算與散戶抱現金過節賣壓湧現，盤中一路走低！' }
  ];

  const midEnvironments = [
    { name: '【盤中跳水】', type: 'down', news: '午盤獲利了結賣壓湧現，指數急轉直下！' },
    { name: '【拉尾盤訊號】', type: 'up', news: '內資買單強勢拉抬，指數強勢拉升突破當日高點！' },
    { name: '【外資瘋狂提款】', type: 'down', news: '外資盤中大舉賣出，大型權值股遭受重創！' },
    { name: '【主力洗盤誘多】', type: 'down', news: '拉高後爆量下殺，甩轎力道強勁，市場散戶死傷慘重！' },
    { name: '【橫盤死寂】', type: 'up', news: '多空交戰陷入膠著，買賣力道平勻，股價幾乎不動。' },
    { name: '【主力鎖漲停】', type: 'up', news: '買單強勢鎖死漲停，市場搶購氣氛高漲，散戶追高！' },
    { name: '【跌停打開誘空】', type: 'up', news: '爆量打開跌停，逢低買單強勢接盤，掀起反彈浪潮！' },
    { name: '【當沖客尾盤殺多】', type: 'down', news: '接近一點，無本當沖客強制平倉賣壓排山倒海湧現！' },
    { name: '【法人暗中吃貨】', type: 'up', news: '投信連買加碼，盤中低點支撐極強，股價步步墊高！' },
    { name: '【黑天鵝傳言爆發】', type: 'down', news: '盤中突發產業利空消息，市場恐慌賣壓蔓延！' }
  ];

  const storyPool = [
    "家道中落，家裡負債累累，你被迫拿僅存的 100 萬積蓄 ALL IN 股市，希望能鹹魚翻身！",
    "被交往五年的女友嫌棄沒出息狠甩，你決定化悲憤為力量，帶著 100 萬投身台股證明自己！",
    "中年失業又逢房貸壓頂，身上僅剩 100 萬退休金，只能在股市裡搏一把生路。",
    "聽信隔壁鄰居明牌買航運慘遭套牢，這次你決定自己當操盤手，把本金凹回來！",
    "剛從大學畢業，把打工存下的 100 萬全部投入當沖，夢想成為下一個少年股神。",
    "偶爾在路上撿到一本神祕的操盤筆記，你毅然決然辭職，攜帶 100 萬資金踏入股市深淵。",
    "背負沉重學貸與家計，你把最後的 100 萬身家壓在台積電供應鏈上，今晚住公園還是帝寶就看這一次！"
  ];

  const gameOverTitles = [
    '【公園帝寶頂樓戶】', '【北車紙箱國王】', '【龍山寺地墊VIP】', '【乞丐超人現身】',
    '【山頂套牢榮譽市民】', '【違約交割常勝軍】', '【割韭菜現場遺骸】', '【資產清零藝術家】',
    '【台股無償獻血志工】', '【滿手套牢阿呆谷谷主】'
  ];

  const defaultLeaderboard = [
    { name: '少年股神洪大大', title: '【哲哲接班人】', days: 48, assets: 3250000 },
    { name: '信義區當沖王', title: '【極限當沖賭王】', days: 32, assets: 1850000 },
    { name: '台北紙箱國王', title: '【北車紙箱國王】', days: 15, assets: 0 },
    { name: '公園阿伯', title: '【資深股市生還者】', days: 12, assets: 620000 }
  ];

  function getRandomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function generateDynamicEnvironment() {
    const isUp = Math.random() < 0.5;
    const pctValue = parseFloat((Math.random() * 4.9 + 0.1).toFixed(1));
    const ev = getRandomChoice(environments);
    return {
      name: ev.name,
      type: isUp ? 'up' : 'down',
      news: ev.news,
      changeRate: isUp ? (pctValue / 100) : (-pctValue / 100),
      change: `${isUp ? '+' : '-'}${pctValue}%`
    };
  }

  function generateDynamicMidEnvironment() {
    const isUp = Math.random() < 0.5;
    const pctValue = parseFloat((Math.random() * 4.9 + 0.1).toFixed(1));
    const ev = getRandomChoice(midEnvironments);
    return {
      name: ev.name,
      type: isUp ? 'up' : 'down',
      news: ev.news,
      changeRate: isUp ? (pctValue / 100) : (-pctValue / 100),
      change: `${isUp ? '+' : '-'}${pctValue}%`
    };
  }

  function generateAfterMarketData() {
    const generateItem = (basePrice, isPoint = false) => {
      const isUp = Math.random() < 0.5;
      const pct = (Math.random() * 2.5 + 0.1).toFixed(2);
      const diff = parseFloat((basePrice * (pct / 100)).toFixed(2));
      const finalPrice = isUp ? basePrice + diff : basePrice - diff;
      return {
        price: isPoint ? Math.round(finalPrice).toLocaleString() : finalPrice.toFixed(2),
        pct: `${isUp ? '+' : '-'}${pct}%`,
        color: isUp ? 'red' : 'green'
      };
    };

    return {
      dow: generateItem(39000, true),
      sp500: generateItem(5200, true),
      sox: generateItem(4800, true),
      gold: generateItem(2350.5),
      usdt: generateItem(32.2),
      btc: generateItem(67500, true)
    };
  }

  let state = getInitialState();

  function getInitialState() {
    return {
      day: 1,
      assets: 1000000,
      startDayAssets: 1000000,
      shares: 0,
      hp: 100,
      taiex: 40000,
      startDayTaiex: 40000,
      openTaiexOffset: 0,
      phase: 'INIT_STORY',
      currentStory: getRandomChoice(storyPool),
      playerName: '',
      currentEnv: null,
      currentMidEnv: null,
      afterMarketData: null,
      tacticalChoice: null,
      tacticalLog: null,
      timer: null,
      timeLeft: 10,
      dailyLog: [],
      dayTradeCount: 0,
      currentTab: 'history',
      assignedGameOverTitle: null,
      lastHpLog: '',
      lastFeeCost: 0,
      nextDividendDay: Math.floor(Math.random() * 17) + 12,
      lastDividendInfo: null
    };
  }

  function resetToDayOne() {
    state = getInitialState();
    switchTab('history');
    renderPhase();
  }

  function calculateTitle() {
    const profitRate = ((state.assets - 1000000) / 1000000) * 100;
    if (state.assets <= 0 || state.hp <= 0) {
      if (!state.assignedGameOverTitle) state.assignedGameOverTitle = getRandomChoice(gameOverTitles);
      return state.assignedGameOverTitle;
    }
    if (profitRate <= -30) return '【台南反指標】';
    if (profitRate <= -15 && state.hp < 40) return '【股市冥燈】';
    if (profitRate >= 60) return '【哲哲接班人】';
    if (profitRate >= 30) return '【台股少年股神】';
    if (profitRate >= 10) return '【波段操盤大師】';
    if (state.dayTradeCount >= 3) return '【極限當沖賭王】';
    if (state.day >= 10) return '【資深股市生還者】';
    if (profitRate < 0) return '【韭菜熟成中】';
    return '【台股新星散戶】';
  }

  function startTimer(seconds, onTimeout) {
    clearInterval(state.timer);
    state.timeLeft = seconds;
    const timerBox = document.getElementById('timer-box');
    const timerSec = document.getElementById('timer-sec');
    if (timerBox) timerBox.style.display = 'block';
    if (timerSec) timerSec.innerText = state.timeLeft;

    state.timer = setInterval(() => {
      state.timeLeft--;
      if (timerSec) timerSec.innerText = state.timeLeft;
      if (state.timeLeft <= 0) {
        clearInterval(state.timer);
        onTimeout();
      }
    }, 1000);
  }

  function stopTimer() {
    clearInterval(state.timer);
    const timerBox = document.getElementById('timer-box');
    if (timerBox) timerBox.style.display = 'none';
  }

  function updateHUD() {
    document.getElementById('assets').innerText = state.assets.toLocaleString();
    document.getElementById('shares').innerText = state.shares.toLocaleString();
    document.getElementById('hp').innerText = state.hp.toFixed(1);
    document.getElementById('day').innerText = state.day;
    document.getElementById('title-badge').innerText = calculateTitle();

    const taiexHud = document.getElementById('taiex-hud');
    const taiexDiff = state.taiex - state.startDayTaiex;
    const taiexSign = taiexDiff >= 0 ? '+' : '';
    const taiexColor = taiexDiff >= 0 ? 'red' : 'green';
    taiexHud.innerHTML = `<span class="${taiexColor}">${state.taiex.toLocaleString()} (${taiexSign}${taiexDiff})</span>`;
  }

  window.switchTab = function(tab) {
    state.currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (tab === 'history') {
      document.getElementById('btn-tab-history').classList.add('active');
      document.getElementById('sidebar-tab-title').innerText = '📜 每日對帳歷史';
      renderHistory();
    } else {
      document.getElementById('btn-tab-leaderboard').classList.add('active');
      document.getElementById('sidebar-tab-title').innerText = '🏆 全台散戶排行榜';
      renderLeaderboard();
    }
  }

  function renderHistory() {
    const container = document.getElementById('sidebar-content');
    if (state.dailyLog.length === 0) {
      container.innerHTML = `<div style="color:#888;text-align:center;margin-top:20px;">尚無結算紀錄</div>`;
      return;
    }
    container.innerHTML = state.dailyLog.map(item => {
      const diffColor = item.profit >= 0 ? 'red' : 'green';
      const sign = item.profit >= 0 ? '+' : '';
      return `
        <div class="history-card">
          <div class="day-header">
            <span>Day ${item.day} ${item.env}</span>
            <span class="${diffColor}">${sign}$${item.profit.toLocaleString()} (${sign}${item.pct}%)</span>
          </div>
          <div style="color: #aaa;">大盤收盤：${item.taiexEnd.toLocaleString()} (${item.taiexPct})</div>
          <div style="color: #aaa;">剩餘持股：${item.shares.toLocaleString()} 股</div>
          <div style="color: #aaa;">手續費+證交稅：$${(item.fee || 0).toLocaleString()}</div>
          ${item.dividend ? `<div style="color: #69f0ae;">🎁 股利入帳：+$${item.dividend.toLocaleString()}</div>` : ''}
          ${item.tacticalLog ? `<div style="color: #ffd54f;">🎯 盤後戰術：${item.tacticalLog}</div>` : ''}
          <div style="color: #aaa;">期末資產：$${item.endAssets.toLocaleString()}</div>
        </div>
      `;
    }).slice().reverse().join('');
  }

  async function renderLeaderboard() {
    const container = document.getElementById('sidebar-content');
    container.innerHTML = `<div style="color:#888;text-align:center;margin-top:20px;">載入排行榜數據中...</div>`;

    let board = [];
    try {
      const res = await fetch('/api/leaderboard');
      if (res.ok) {
        board = await res.json();
      } else {
        throw new Error('無 API 支援');
      }
    } catch (err) {
      const localData = localStorage.getItem('stock_sim_leaderboard');
      if (localData) {
        board = JSON.parse(localData);
      } else {
        board = [...defaultLeaderboard];
        localStorage.setItem('stock_sim_leaderboard', JSON.stringify(board));
      }
    }

    if (!board || board.length === 0) {
      container.innerHTML = `<div style="color:#888;text-align:center;margin-top:20px;">全台尚無榜單記錄</div>`;
      return;
    }

    board.sort((a, b) => b.days - a.days);

    container.innerHTML = board.map((item, idx) => `
      <div class="leaderboard-item">
        <div><b>#${idx + 1} ${item.name}</b><br><small style="color:#aaa;">${item.title || '台股散戶'}</small></div>
        <div style="text-align:right;"><span class="red">${item.days} 天</span><br><small>$${(item.assets || 0).toLocaleString()}</small></div>
      </div>
    `).join('');
  }

  window.startGameWithStory = function() {
    const nameInput = document.getElementById('setup-name').value.trim();
    if (!nameInput) {
      alert('請先輸入你的散戶代號才能進入市場！');
      return;
    }
    state.playerName = nameInput;
    state.phase = 'OPEN';
    renderPhase();
  };

  window.submitScore = async function() {
    const scoreData = {
      name: state.playerName || '無名韭菜',
      days: state.day,
      assets: state.assets,
      title: calculateTitle(),
      timestamp: Date.now()
    };

    let isRemoteSuccess = false;
    try {
      const res = await fetch('/api/leaderboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(scoreData)
      });
      if (res.ok) isRemoteSuccess = true;
    } catch (error) {
      isRemoteSuccess = false;
    }

    const localData = localStorage.getItem('stock_sim_leaderboard');
    let board = localData ? JSON.parse(localData) : [...defaultLeaderboard];
    board.push(scoreData);
    board.sort((a, b) => b.days - a.days);
    localStorage.setItem('stock_sim_leaderboard', JSON.stringify(board));

    alert(isRemoteSuccess ? '🎉 成功登錄全台雲端排行榜！' : '🎉 成績已成功登錄至本地排行榜！');
    switchTab('leaderboard');
  }

  function recordDailyLog() {
    const existingIndex = state.dailyLog.findIndex(l => l.day === state.day);

    const profit = state.assets - state.startDayAssets;
    const pct = ((profit / state.startDayAssets) * 100).toFixed(1);
    const taiexDiffTotal = state.taiex - state.startDayTaiex;
    const taiexPctTotal = ((taiexDiffTotal / state.startDayTaiex) * 100).toFixed(2);

    const logData = {
      day: state.day,
      env: state.currentEnv ? state.currentEnv.name : '',
      profit: profit,
      pct: pct,
      taiexEnd: state.taiex,
      taiexPct: `${taiexDiffTotal >= 0 ? '+' : ''}${taiexPctTotal}%`,
      shares: state.shares,
      fee: state.lastFeeCost,
      dividend: state.lastDividendInfo ? state.lastDividendInfo.totalDividend : 0,
      tacticalLog: state.tacticalLog || null,
      endAssets: state.assets
    };

    if (existingIndex !== -1) {
      state.dailyLog[existingIndex] = logData;
    } else {
      state.dailyLog.push(logData);
    }

    if (state.currentTab === 'history') renderHistory();
  }

  function updatePreviousDayTacticalLog(logText) {
    const prevDayIndex = state.dailyLog.findIndex(l => l.day === state.day - 1);
    if (prevDayIndex !== -1) {
      state.dailyLog[prevDayIndex].tacticalLog = logText;
      if (state.currentTab === 'history') renderHistory();
    }
  }

  function renderPhase() {
    if (state.phase === 'OPEN') {
      if (!state.currentEnv) {
        state.currentEnv = generateDynamicEnvironment();
        
        if (state.tacticalChoice === 'TAIEX_UP' || state.tacticalChoice === 'TAIEX_DOWN') {
          const isActualUp = state.currentEnv.type === 'up';
          const predictedUp = state.tacticalChoice === 'TAIEX_UP';
          const isWin = isActualUp === predictedUp;
          const pnlPct = isWin ? (getRandomInt(3, 8) / 100) : (-getRandomInt(3, 8) / 100);
          const pnlAmount = Math.round(state.assets * pnlPct);
          state.assets += pnlAmount;
          const pnlSign = pnlAmount >= 0 ? '+' : '';
          state.tacticalLog = `預測大盤【${predictedUp?'看漲':'看跌'}】${isWin?'成功🎯':'失敗❌'}，資產 ${pnlSign}$${pnlAmount.toLocaleString()}`;
          
          updatePreviousDayTacticalLog(state.tacticalLog);
        }
        
        const openDiff = Math.round(state.startDayTaiex * state.currentEnv.changeRate);
        state.openTaiexOffset = openDiff;
        state.taiex = state.startDayTaiex + state.openTaiexOffset;
        
        state.startDayAssets = state.assets;
        state.lastFeeCost = 0;
        state.lastDividendInfo = null;
      }
    }

    if (state.phase === 'MID' && !state.currentMidEnv) {
      state.currentMidEnv = generateDynamicMidEnvironment();
      const midDiff = Math.round(state.startDayTaiex * state.currentMidEnv.changeRate);
      state.taiex = state.startDayTaiex + state.openTaiexOffset + midDiff;
    }

    if (state.phase === 'AFTER') {
      if (!state.afterMarketData) {
        state.afterMarketData = generateAfterMarketData();
      }
      recordDailyLog();
    }

    updateHUD();

    const area = document.getElementById('content-area');

    if (state.phase === 'INIT_STORY') {
      stopTimer();
      area.innerHTML = `
        <h3 style="margin-top:0; color:#ffd54f;">📖 散戶宿命背景生成</h3>
        <div class="story-box">
          <b>【你的命運故事】</b><br>
          ${state.currentStory}
        </div>
        <p>請輸入你的散戶代號（將記錄於排行榜）：</p>
        <input type="text" id="setup-name" placeholder="例如：少年股神洪大大" maxlength="12" value="${state.playerName}">
        <button class="btn btn-next" onclick="startGameWithStory()">🚀 帶著 100 萬資金，踏入台股深淵！</button>
      `;
      return;
    }

    if (state.assets <= 0 || state.hp <= 0) {
      stopTimer();
      const reason = state.assets <= 0 ? '違約交割破產畢業！' : '心理 HP 歸零精神崩潰！';
      const finalTitle = calculateTitle();
      area.innerHTML = `
        <h3 class="red" style="margin-top:0;">🛑 遊戲結束：${reason}</h3>
        <p>你在台股市場中一共存活了 <b>${state.day}</b> 天！</p>
        <div style="background:#222; padding:12px; border-radius:6px; margin:10px 0;">
          <p>你的散戶代號：<b>${state.playerName}</b></p>
          <p>獲得終極稱號：<b style="color:#ffd54f;">${finalTitle}</b></p>
          <button class="btn btn-next" onclick="submitScore()">🏆 上傳成績到排行榜</button>
        </div>
        <button class="btn btn-danger" onclick="resetToDayOne()">🔄 重新投胎，展開新故事 (Day 1)</button>
      `;
      return;
    }

    const envColorClass = state.currentEnv ? (state.currentEnv.type === 'up' ? 'red' : 'green') : 'red';

    if (state.phase === 'OPEN') {
      startTimer(10, () => handleChoice('PANIC'));
      area.innerHTML = `
        ${state.tacticalLog ? `<div class="dividend-box"><b>💡 昨夜盤後戰術開盤結算：</b><br>${state.tacticalLog}</div>` : ''}
        
        <div class="market-info">
          <div>📈 市場環境：<b>${state.currentEnv.name}</b></div>
          <div>早盤走勢：<span class="${envColorClass}">${state.currentEnv.change}</span></div>
        </div>
        <div class="news">📰 【Day ${state.day} - 09:00 早盤】<br>${state.currentEnv.news}</div>
        <p style="margin: 8px 0;">⚡ 請在 10 秒內做出決策：</p>
        <button class="btn" onclick="handleChoice('CASH')">🛡️ 現股買進<br><small style="color:#bbb;">勝率 45~55% | 波動 +3~8% / -2~6% | 稅費 0.44% | 自動換算持股</small></button>
        <button class="btn" onclick="handleChoice('MARGIN')">⚡ 融資開滿<br><small style="color:#bbb;">勝率 35~45% | 波動 +10~20% / -8~16% | 稅費+利息 0.60% | 槓桿放大持股</small></button>
        <button class="btn" onclick="handleChoice('DAY_TRADE')">💥 無本當沖<br><small style="color:#bbb;">勝率 20~30% | 波動 +25~50% / -20~45% | 當沖降稅 0.29% | 不留倉</small></button>
      `;
    } else if (state.phase === 'MID') {
      startTimer(10, () => handleChoice('PANIC'));
      const midEnvColorClass = state.currentMidEnv.type === 'up' ? 'red' : 'green';

      area.innerHTML = `
        <div class="market-info">
          <div>📈 市場環境：<b>${state.currentEnv.name}</b></div>
          <div>午盤走勢：<span class="${midEnvColorClass}">${state.currentMidEnv.change}</span></div>
        </div>
        <div class="news">📰 【Day ${state.day} - 11:30 盤中】${state.currentMidEnv.name} - ${state.currentMidEnv.news}</div>
        <p style="margin: 8px 0;">⚡ 請在 10 秒內做出決策：</p>
        <button class="btn" onclick="handleChoice('HOLD')">🛡️ 硬捏現股 (現有持股：${state.shares.toLocaleString()} 股)<br><small style="color:#bbb;">勝率 30~40% | 波動 +5~12% / -4~10% | 無額外稅費</small></button>
        <button class="btn" onclick="handleChoice('TAKE_PROFIT')">🛑 認賠砍倉 / 部分停損 (隨機砍掉 30%~80% 持股)<br><small style="color:#bbb;">勝率 100% | 保留部分部位繼續凹單</small></button>
        <button class="btn" onclick="handleChoice('DOUBLE_DOWN')">💥 加碼攤平 (持股加倍)<br><small style="color:#bbb;">勝率 15~25% | 波動 +20~40% / -15~35% | 二次稅費 0.44%</small></button>
      `;
    } else if (state.phase === 'AFTER') {
      stopTimer();
      
      const profit = state.assets - state.startDayAssets;
      const pct = ((profit / state.startDayAssets) * 100).toFixed(1);
      const profitColor = profit >= 0 ? 'red' : 'green';
      const sign = profit >= 0 ? '+' : '';

      const taiexDiffTotal = state.taiex - state.startDayTaiex;
      const taiexPctTotal = ((taiexDiffTotal / state.startDayTaiex) * 100).toFixed(2);
      const taiexSign = taiexDiffTotal >= 0 ? '+' : '';
      const taiexColor = taiexDiffTotal >= 0 ? 'red' : 'green';

      const d = state.afterMarketData;

      area.innerHTML = `
        <h3 style="margin-top:0; margin-bottom: 8px;">📊 【Day ${state.day} - 13:30 盤後每日對帳單與戰術擬定】</h3>

        <div class="global-market-grid">
          <div class="market-card">
            <div class="title">🇺🇸 道瓊指數</div>
            <div>${d.dow.price} (<span class="${d.dow.color}">${d.dow.pct}</span>)</div>
          </div>
          <div class="market-card">
            <div class="title">🇺🇸 標普 500</div>
            <div>${d.sp500.price} (<span class="${d.sp500.color}">${d.sp500.pct}</span>)</div>
          </div>
          <div class="market-card">
            <div class="title">🇺🇸 費城半導體</div>
            <div>${d.sox.price} (<span class="${d.sox.color}">${d.sox.pct}</span>)</div>
          </div>
          <div class="market-card">
            <div class="title">🥇 黃金 / 💵 美元</div>
            <div>$${d.gold.price} / NT$${d.usdt.price}</div>
          </div>
          <div class="market-card" style="grid-column: span 2;">
            <div class="title">₿ 加密貨幣 BTC 當日行情</div>
            <div>$${d.btc.price} (<span class="${d.btc.color}">${d.btc.pct}</span>)</div>
          </div>
        </div>

        <p style="margin:5px 0; font-weight:bold; color:#ffd54f;">🎯 盤後戰術擬定（選擇後即刻進入下一天）：</p>
        <div style="display:flex; gap:8px; margin-bottom:8px;">
          <button class="btn" style="flex:1; margin:0; text-align:center;" onclick="handleTacticalChoice('TAIEX_UP')">📈 預測明日台股開盤看漲<br><small style="color:#bbb;">綁定明日開盤漲跌對決</small></button>
          <button class="btn" style="flex:1; margin:0; text-align:center;" onclick="handleTacticalChoice('TAIEX_DOWN')">📉 預測明日台股開盤看跌<br><small style="color:#bbb;">綁定明日開盤漲跌對決</small></button>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn" style="flex:1; margin:0; text-align:center;" onclick="handleTacticalChoice('HEDGE_GOLD_USD')">🛡️ 隔夜避險：黃金/美元<br><small style="color:#bbb;">隔夜避險小幅收益</small></button>
          <button class="btn" style="flex:1; margin:0; text-align:center;" onclick="handleTacticalChoice('HEDGE_BTC')">⚡ 隔夜避險：數位貨幣 BTC<br><small style="color:#bbb;">隔夜避險高波動收益</small></button>
        </div>

        <div class="log-box" style="margin-top:10px;">
          • 今日個人總損益：<span class="${profitColor}">${sign}$${profit.toLocaleString()} (${sign}${pct}%)</span> | 大盤收盤：<span class="${taiexColor}">${state.taiex.toLocaleString()} 點 (${taiexSign}${taiexPctTotal}%)</span><br>
          • 💡 HP 狀態：<span style="color:#ffd54f;">${state.lastHpLog}</span>
        </div>
      `;
    }
  }

  window.handleChoice = function(type) {
    stopTimer();
    let win = false;
    let rate = 0;
    let feeRate = 0;

    if (type === 'PANIC') {
      if (state.phase === 'OPEN') {
        type = getRandomChoice(['CASH', 'MARGIN', 'DAY_TRADE']);
      } else if (state.phase === 'MID') {
        type = getRandomChoice(['HOLD', 'TAKE_PROFIT', 'DOUBLE_DOWN']);
      }
    }

    const rand = Math.random();
    const simulatedStockPrice = getRandomInt(50, 150);

    if (type === 'CASH') {
      feeRate = 0.004425; 
      win = rand < getRandomChoice([0.45, 0.50, 0.55]);
      rate = win ? (getRandomInt(3, 8) / 100) : (-getRandomInt(2, 6) / 100);
      state.shares = Math.floor(state.assets / simulatedStockPrice);

    } else if (type === 'MARGIN') {
      feeRate = 0.006000; 
      win = rand < getRandomChoice([0.35, 0.40, 0.45]);
      rate = win ? (getRandomInt(10, 20) / 100) : (-getRandomInt(8, 16) / 100);
      state.shares = Math.floor((state.assets * 2) / simulatedStockPrice);

    } else if (type === 'DAY_TRADE') {
      feeRate = 0.002925; 
      win = rand < getRandomChoice([0.20, 0.25, 0.30]);
      rate = win ? (getRandomInt(25, 50) / 100) : (-getRandomInt(20, 45) / 100);
      state.dayTradeCount++;
      state.shares = 0;

    } else if (type === 'HOLD') {
      feeRate = 0; 
      win = rand < getRandomChoice([0.30, 0.35, 0.40]);
      rate = win ? (getRandomInt(5, 12) / 100) : (-getRandomInt(4, 10) / 100);

    } else if (type === 'TAKE_PROFIT') {
      feeRate = 0;
      rate = 0;
      state.shares = Math.floor(state.shares * (1 - (getRandomInt(30, 80) / 100)));

    } else if (type === 'DOUBLE_DOWN') {
      feeRate = 0.004425; 
      win = rand < getRandomChoice([0.15, 0.20, 0.25]);
      rate = win ? (getRandomInt(20, 40) / 100) : (-getRandomInt(15, 35) / 100);
      state.shares *= 2;
    }

    state.lastFeeCost += Math.round(state.assets * feeRate);
    state.assets = Math.round(state.assets * (1 + (rate - feeRate)));

    if (state.phase === 'OPEN') {
      state.phase = 'MID';
    } else if (state.phase === 'MID') {
      
      if (state.day >= state.nextDividendDay && state.shares > 0) {
        const perShareDividend = (Math.random() * 3 + 0.5).toFixed(2);
        const totalDividend = Math.round(state.shares * perShareDividend);
        state.assets += totalDividend;
        state.lastDividendInfo = { totalDividend: totalDividend };
        state.nextDividendDay = state.day + getRandomInt(8, 20);
      }

      const profit = state.assets - state.startDayAssets;
      const pct = ((profit / state.startDayAssets) * 100).toFixed(1);
      const absPnlPct = Math.abs(profit / state.startDayAssets) * 100;
      
      if (absPnlPct === 0) {
        state.lastHpLog = `【波瀾不驚】今日損益平盤，HP 保持不變。`;
      } else if (profit > 0) {
        const hpGain = Math.min(15, parseFloat((absPnlPct * 0.8).toFixed(1)));
        state.hp = Math.min(100, state.hp + hpGain);
        state.lastHpLog = `【賺錢爽翻】今日大賺 +${pct}%，心理 HP 回復 +${hpGain}%！`;
      } else {
        const hpLoss = Math.min(30, parseFloat((absPnlPct * 1.2).toFixed(1)));
        state.hp = Math.max(0, state.hp - hpLoss);
        state.lastHpLog = `【韭菜受創】今日虧損 ${pct}%，心理 HP 扣減 -${hpLoss}%！`;
      }

      state.phase = 'AFTER';
    }

    renderPhase();
  };

  window.handleTacticalChoice = function(choice) {
    stopTimer();
    state.tacticalChoice = choice;

    if (choice === 'PANIC') {
      state.tacticalChoice = getRandomChoice(['TAIEX_UP', 'TAIEX_DOWN', 'HEDGE_GOLD_USD', 'HEDGE_BTC']);
    }

    if (state.tacticalChoice === 'HEDGE_GOLD_USD') {
      const isWin = Math.random() < 0.6;
      const pnlAmount = Math.round(state.assets * (isWin ? (getRandomInt(1, 3) / 100) : (-getRandomInt(1, 2) / 100)));
      state.assets += pnlAmount;
      state.tacticalLog = `黃金/美元避險${isWin?'獲利':'微虧'} ${pnlAmount >= 0 ? '+' : ''}$${pnlAmount.toLocaleString()}`;
    } else if (state.tacticalChoice === 'HEDGE_BTC') {
      const isWin = Math.random() < 0.45;
      const pnlAmount = Math.round(state.assets * (isWin ? (getRandomInt(4, 10) / 100) : (-getRandomInt(4, 9) / 100)));
      state.assets += pnlAmount;
      state.tacticalLog = `BTC 避險${isWin?'爆賺🎯':'爆倉❌'} ${pnlAmount >= 0 ? '+' : ''}$${pnlAmount.toLocaleString()}`;
    } else if (state.tacticalChoice === 'TAIEX_UP' || state.tacticalChoice === 'TAIEX_DOWN') {
      state.tacticalLog = null; 
    }

    recordDailyLog();

    state.day++;
    state.startDayTaiex = state.taiex;
    state.currentEnv = null;
    state.currentMidEnv = null;
    state.afterMarketData = null;
    state.phase = 'OPEN';
    renderPhase();
  };

  renderPhase();
</script>
</body>
</html>
