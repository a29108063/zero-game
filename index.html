    return {
      dow: generateItem(39000, true),
      sp500: generateItem(5200, true),
      sox: generateItem(4800, true),
      gold: generateItem(2350.5),
      usdt: generateItem(32.2),
      btc: generateItem(67500, true)
    };
  }

  function generateDynamicEnvironment(targetType = null, globalMarket = null, tacticalChoice = null) {
    let pool = [...baseEnvironments, ...historicalEnvironments, ...breakingNewsEnvironments];
    
    let globalBias = 0;
    if (globalMarket) {
      globalBias += (globalMarket.dow.rawPct || 0);
      globalBias += (globalMarket.sox.rawPct || 0) * 1.5;
      globalBias += (globalMarket.btc.rawPct || 0) * 0.5;
    }

    let tacticalReport = null;
    if (tacticalChoice) {
      const isTacticsSuccess = Math.random() < 0.6;
      if (tacticalChoice.type === 'TAIEX_UP') {
        if (isTacticsSuccess) targetType = 'up';
      } else if (tacticalChoice.type === 'TAIEX_DOWN') {
        if (isTacticsSuccess) targetType = 'down';
      } else if (tacticalChoice.type === 'HEDGE_GOLD_USD') {
        if (globalBias < 0) globalBias *= 0.5;
      }
      tacticalReport = {
        name: tacticalChoice.tacticsName,
        isWin: isTacticsSuccess
      };
      state.openingTacticalReport = tacticalReport;
    } else {
      state.openingTacticalReport = null;
    }

    if (targetType) {
      pool = pool.filter(e => e.type === targetType);
    } else {
      const autoType = globalBias >= 0 ? 'up' : 'down';
      pool = pool.map(e => {
        let weight = e.weightBonus || 1;
        if (e.type === autoType) weight *= 2.2;
        return { ...e, calculatedWeight: weight };
      });
    }

    let selectedEv;
    if (!targetType && globalMarket) {
      let totalWeight = pool.reduce((sum, item) => sum + (item.calculatedWeight || 1), 0);
      let randomVal = Math.random() * totalWeight;
      let currentSum = 0;
      for (let item of pool) {
        currentSum += (item.calculatedWeight || 1);
        if (randomVal <= currentSum) {
          selectedEv = item;
          break;
        }
      }
    }
    if (!selectedEv) {
      selectedEv = getRandomChoice(pool);
    }

    const isUp = selectedEv.type === 'up';
    let basePctFactor = Math.abs(globalBias) > 2 ? 1.5 : 1.0;
    const pctValue = parseFloat(((Math.random() * 3.5 + 0.5) * basePctFactor).toFixed(1));

    return {
      name: selectedEv.name,
      type: selectedEv.type,
      news: selectedEv.news + (globalMarket ? ` (因今日國際盤勢連動：${globalBias >= 0 ? '外資信心回穩' : '國際利空壓抑'})` : ''),
      dividendChance: selectedEv.dividendChance ?? 0.15,
      dividendMultiplier: selectedEv.dividendMultiplier ?? 1.0,
      changeRate: isUp ? (pctValue / 100) : (-pctValue / 100),
      change: `${isUp ? '+' : '-'}${pctValue}%`
    };
  }

  function generateDynamicMidEnvironment() {
    const isUp = Math.random() < 0.5;
    const pctValue = parseFloat((Math.random() * 4.9 + 0.1).toFixed(1));
    const ev = getRandomChoice(midEnvironments);
    return {

  }

  function checkDividendPayout() {
    let isDividendDay = false;
    let isCoolingDown = false;

    if (state.lastDividendDay === -10) {
      if (state.day === 5) {
        isDividendDay = true;
      } else {
        isCoolingDown = true;
      }
    } else {
      const daysSinceLastDividend = state.day - state.lastDividendDay;
      isCoolingDown = daysSinceLastDividend < 10;
      const chance = state.currentEnv ? state.currentEnv.dividendChance : 0.15;
      isDividendDay = !isCoolingDown && (Math.random() < chance);
    }

    const multiplier = state.currentEnv ? state.currentEnv.dividendMultiplier : 1.0;

    if (isDividendDay) {
      state.lastDividendDay = state.day;
      let rawPerShare = (Math.random() * 4.0 + 0.8) * multiplier;
      const dividendPerShare = parseFloat(Math.max(0.8, rawPerShare).toFixed(1));

      if (state.shares > 0) {
        const totalDividend = Math.round(state.shares * dividendPerShare);
        state.assets += totalDividend;
        
        let hpGainPct = 0;
        if (state.hp < 100) {
          const baseRatio = Math.min(totalDividend / 50000, 1.0);
          hpGainPct = getRandomFloat(4.0, 12.0, 1) * multiplier * (1 + baseRatio * 0.5);
          hpGainPct = Math.min(hpGainPct, 100 - state.hp);
        }

        state.lastDividendInfo = {
          perShare: dividendPerShare,
          totalDividend: totalDividend,
          missed: false,
          hpGain: parseFloat(hpGainPct.toFixed(1)),
          coolingDown: false
        };
      } else {
        state.lastDividendInfo = {
          perShare: dividendPerShare,
          totalDividend: 0,
          missed: true,
          hpGain: -5.0,
          coolingDown: false
        };
      }
    } else {
      state.lastDividendInfo = {
        perShare: 0,
        totalDividend: 0,
        missed: false,
        hpGain: 0,
        coolingDown: isCoolingDown
      };
    }
  }

  function handleChoice(actionType) {
    stopTimer();
    const env = state.phase === 'OPEN' ? state.currentEnv : state.currentMidEnv;
    const isUpEnv = env.type === 'up';
    
    // 💡【核心新增】取得當前大盤漲跌幅絕對值（例如 changeRate 為 0.035 時，envMagnitude 為 0.035）
    // 這代表當前市場的「動能／波動強度」
    const envMagnitude = Math.abs(env.changeRate || 0.02);
    
    // 💡【勝率動態加成】大盤漲跌幅度越猛，勝率偏移越明顯（最大加成 +/- 15%）
    // 牛市狂飆時大盤 +3.5%，勝率額外 +10.5%；熊市血洗時 -3.5%，勝率額外 -10.5%
    const winRateBonus = isUpEnv ? (envMagnitude * 3.0) : -(envMagnitude * 3.0);
    const clampWinRate = (baseRate) => Math.min(0.92, Math.max(0.08, baseRate + winRateBonus));

    // 💡【報酬率倍率加成】大盤波動越大，獲利與虧損的震幅也跟著放大
    const pnlVolatilityMultiplier = 1.0 + (envMagnitude * 10); // 例如 3.5% 漲跌幅會放大 1.35 倍損益

    let pnlRate = 0;
    let feeRate = 0;

    if (actionType === 'CASH') {
      // 現股買進：基礎勝率根據大盤動態調整
      const win = Math.random() < clampWinRate(isUpEnv ? 0.58 : 0.38);
      const basePnl = win ? getRandomFloat(0.02, 0.05, 3) : -getRandomFloat(0.02, 0.05, 3);
      pnlRate = basePnl * pnlVolatilityMultiplier;
      feeRate = 0.001425;
      state.shares = Math.floor((state.assets * 0.7) / (state.taiex / 1000));

    } else if (actionType === 'MARGIN') {
      // 融資槓桿：高度受大盤波幅影響
      const win = Math.random() < clampWinRate(isUpEnv ? 0.50 : 0.25);
      const basePnl = win ? getRandomFloat(0.10, 0.25, 3) : -getRandomFloat(0.10, 0.25, 3);
      pnlRate = basePnl * pnlVolatilityMultiplier;
      feeRate = 0.0020;
      state.shares = Math.floor((state.assets * 2.0) / (state.taiex / 1000));

    } else if (actionType === 'DAY_TRADE') {
      // 當沖交易
      state.dayTradeCount++;
      const win = Math.random() < clampWinRate(isUpEnv ? 0.45 : 0.28);
      const basePnl = win ? getRandomFloat(0.08, 0.15, 3) : -getRandomFloat(0.08, 0.15, 3);
      pnlRate = basePnl * pnlVolatilityMultiplier;
      feeRate = 0.0015;
      state.shares = 0;

    } else if (actionType === 'HOLD') {
      // 按兵不動
      const win = Math.random() < clampWinRate(isUpEnv ? 0.60 : 0.35);
      const basePnl = win ? getRandomFloat(0.01, 0.03, 3) : -getRandomFloat(0.01, 0.03, 3);
      pnlRate = basePnl * pnlVolatilityMultiplier;

    } else if (actionType === 'TAKE_PROFIT') {
      // 獲利入袋 / 停損停利
      const cutRatio = getRandomFloat(0.3, 0.7, 2);
      state.shares = Math.floor(state.shares * (1 - cutRatio));
      const win = Math.random() < clampWinRate(isUpEnv ? 0.68 : 0.52);
      const basePnl = win ? getRandomFloat(0.01, 0.03, 3) : -getRandomFloat(0.01, 0.04, 3);
      pnlRate = basePnl * pnlVolatilityMultiplier;

    } else if (actionType === 'DOUBLE_DOWN') {
      // 攤平 / 加碼 ALL IN
      const win = Math.random() < clampWinRate(isUpEnv ? 0.38 : 0.15);
      const basePnl = win ? getRandomFloat(0.15, 0.35, 3) : -getRandomFloat(0.20, 0.35, 3);
      pnlRate = basePnl * pnlVolatilityMultiplier;
      feeRate = 0.0044;
      state.shares = state.shares === 0 
        ? Math.floor((state.assets * 0.7) / (state.taiex / 1000))
        : state.shares * 2;
    }

  // --- 黃金/美元避險戰術 對沖總資產變動機制 ---
  if (state.pendingTacticalChoice && state.pendingTacticalChoice.type === 'HEDGE_GOLD_USD') {
    const goldPct = (state.afterMarketData.gold.rawPct || 0) / 100;
    const usdPct = (state.afterMarketData.usdt.rawPct || 0) / 100;
    // 當大盤虧損時，黃金與美元的避險收益能對沖掉部分虧損
    const hedgeBenefit = (goldPct + usdPct) * 0.5;
    pnlRate += hedgeBenefit;
  }
    

    const feeCost = Math.round(state.assets * feeRate);
    const pnlAmount = Math.round(state.assets * pnlRate) - feeCost;
    state.assets += pnlAmount;
    state.lastFeeCost += feeCost;

    if (state.phase === 'OPEN') {
      state.phase = 'MID';
    } else if (state.phase === 'MID') {
      state.phase = 'AFTER';
      checkDividendPayout();
      calculateDailyHpSettlement();
      state.afterMarketData = generateAfterMarketData();
      recordDailyLog();
    }
    saveGame();
    renderPhase();
  }
    // 2. 修正動態環境生成：納入美元/黃金對沖與國際盤連動
function generateDynamicEnvironment(targetType = null, globalMarket = null, tacticalChoice = null) {
  let pool = [...baseEnvironments, ...historicalEnvironments, ...breakingNewsEnvironments];
  
  let globalBias = 0;
  if (globalMarket) {
   globalBias += (globalMarket.dow.rawPct || 0) * 1.0;    // 道瓊指數 (權重 1.0)
    globalBias += (globalMarket.sp500.rawPct || 0) * 1.2;  // 標普 500 (新增，權重 1.2)
    globalBias += (globalMarket.sox.rawPct || 0) * 1.5;    // 費城半導體 (權重 1.5)
    globalBias += (globalMarket.btc.rawPct || 0) * 0.5;    // 比特幣 (權重 0.5)
    globalBias += (globalMarket.usdt.rawPct || 0) * (-0.8); // 美元/台幣 (新增負權重 -0.8)
  }
  let tacticalReport = null;
  if (tacticalChoice) {
    const isTacticsSuccess = Math.random() < 0.2;
    if (tacticalChoice.type === 'TAIEX_UP') {
      if (isTacticsSuccess) targetType = 'up';
    } else if (tacticalChoice.type === 'TAIEX_DOWN') {
      if (isTacticsSuccess) targetType = 'down';
    } else if (tacticalChoice.type === 'HEDGE_GOLD_USD') {
      // 戰術成功或下殺盤時，黃金與美金戰術強行吸收 50% 國際利空衝擊
      if (globalBias < 0) globalBias *= 0.5;
    }
    tacticalReport = {
      name: tacticalChoice.tacticsName,
      isWin: isTacticsSuccess || tacticalChoice.type === 'HEDGE_GOLD_USD'
    };
    state.openingTacticalReport = tacticalReport;
  } else {
    state.openingTacticalReport = null;
  }

  if (targetType) {
    pool = pool.filter(e => e.type === targetType);
  } else {
    const autoType = globalBias >= 0 ? 'up' : 'down';
    pool = pool.map(e => {
      let weight = e.weightBonus || 1;
      if (e.type === autoType) weight *= 2.2;
      return { ...e, calculatedWeight: weight };
    });
  }

  let selectedEv;
  if (!targetType && globalMarket) {
    let totalWeight = pool.reduce((sum, item) => sum + (item.calculatedWeight || 1), 0);
    let randomVal = Math.random() * totalWeight;
    let currentSum = 0;
    for (let item of pool) {
      currentSum += (item.calculatedWeight || 1);
      if (randomVal <= currentSum) {
        selectedEv = item;
        break;
      }
    }
  }
  if (!selectedEv) {
    selectedEv = getRandomChoice(pool);
  }

  const isUp = selectedEv.type === 'up';
  let basePctFactor = Math.abs(globalBias) > 2 ? 1.5 : 1.0;
  const pctValue = parseFloat(((Math.random() * 3.5 + 0.5) * basePctFactor).toFixed(1));

  return {
    name: selectedEv.name,
    type: selectedEv.type,
    news: selectedEv.news + (globalMarket ? ` (因夜盤匯率與美股連動：${globalBias >= 0 ? '資金回流台幣升值/夜盤強勢' : '國際利空與匯率避險開盤壓抑'})` : ''),
    dividendChance: selectedEv.dividendChance ?? 0.15,
    dividendMultiplier: selectedEv.dividendMultiplier ?? 1.0,
    changeRate: isUp ? (pctValue / 100) : (-pctValue / 100),
    change: `${isUp ? '+' : '-'}${pctValue}%`
  };
}

// 3. 盤後戰術選擇觸發設定（確保玩家可以選擇黃金/美元對沖戰術）
function applyAfterMarketTactics(tacticsType) {
  if (tacticsType === 'HEDGE_GOLD_USD') {
    state.pendingTacticalChoice = {
      type: 'HEDGE_GOLD_USD',
      tacticsName: '🥇 黃金/美元避險戰術（雙重對沖開盤與總資產）'
    };
  } else if (tacticsType === 'TAIEX_UP') {
    state.pendingTacticalChoice = {
      type: 'TAIEX_UP',
      tacticsName: '📈 夜盤押注看多（影響開盤）'
    };
  } else if (tacticsType === 'TAIEX_DOWN') {
    state.pendingTacticalChoice = {
      type: 'TAIEX_DOWN',
      tacticsName: '📉 夜盤押注看空（影響開盤）'
    };
  }
  saveGame();
}

  function calculateDailyHpSettlement() {
    const dayProfit = state.assets - state.startDayAssets;
    const baseAssets = Math.max(state.startDayAssets, 1);
    let baseHpImpact = 0;

    if (dayProfit < 0) {
      const lossRatio = Math.abs(dayProfit) / baseAssets;
      baseHpImpact = -(lossRatio * 100);
   }  else if (dayProfit > 0) {
      
      const profitRatio = (dayProfit / baseAssets) * 100;
      baseHpImpact = profitRatio;
    }

    let dividendHpImpact = 0;
    if (state.lastDividendInfo) {
      dividendHpImpact = state.lastDividendInfo.hpGain || 0;
    }

    const totalHpChange = baseHpImpact + dividendHpImpact;
    state.lastDayHpChange = totalHpChange;
    state.hp = roundHp(state.hp + totalHpChange);
  }

  function handleTacticalChoice(choice) {
    let targetType = 'up';
    let tacticsName = '';

    if (choice === 'TAIEX_UP') {
      tacticsName = '明日台股多頭續衝';
      targetType = 'up';
    } else if (choice === 'TAIEX_DOWN') {
      tacticsName = '明日空頭大反撲';
      targetType = 'down';
    } else if (choice === 'HEDGE_GOLD_USD') {
      tacticsName = '黃金/美元動態避險';
      targetType = Math.random() < 0.5 ? 'up' : 'down';
    } else if (choice === 'HEDGE_BTC') {
      tacticsName = 'BTC風險資產聯動';
      targetType = Math.random() < 0.6 ? 'up' : 'down';
    }

    state.pendingTacticalChoice = {
      type: choice,
      targetType: targetType,
      tacticsName: tacticsName
    };

    state.todayTacticalLog = `【${tacticsName}】已部署，待明日開盤結算`;

    state.day++;
    state.phase = 'OPEN';
    state.currentEnv = null;
    state.currentMidEnv = null;
    state.lastFeeCost = 0;
    state.startDayTaiex = state.taiex;
    state.startDayAssets = state.assets;
    state.startDayHp = state.hp;
    saveGame();
    renderPhase();
  }

  function recordDailyLog() {
    const profit = state.assets - state.startDayAssets;
    const pct = ((profit / Math.max(state.startDayAssets, 1)) * 100).toFixed(1);
    const taiexDiffTotal = state.taiex - state.startDayTaiex;
    const taiexPctTotal = ((taiexDiffTotal / state.startDayTaiex) * 100).toFixed(1);

    let tacticalDesc = null;
    if (state.openingTacticalReport) {
      tacticalDesc = `${state.openingTacticalReport.name} (${state.openingTacticalReport.isWin ? '成功预测' : '预测失效'})`;
    }

    state.dailyLog.push({
      day: state.day,
      env: state.currentEnv.name,
      profit: profit,
      pct: pct,
      openType: state.currentEnv.type,
      openChange: state.currentEnv.change,
      midType: state.currentMidEnv ? state.currentMidEnv.type : 'up',
      midChange: state.currentMidEnv ? state.currentMidEnv.change : '0%',
      taiexEnd: state.taiex,
      taiexPct: `${taiexDiffTotal >= 0 ? '+' : ''}${taiexPctTotal}%`,
      shares: state.shares,
      fee: state.lastFeeCost,
      endAssets: state.assets,
      endHp: state.hp,
      hpChange: state.lastDayHpChange,
      dividend: (state.lastDividendInfo && !state.lastDividendInfo.missed) ? state.lastDividendInfo.totalDividend : 0,
      tacticalReport: tacticalDesc
    });
    
    if (state.currentTab === 'history') renderHistory();
  }

  function renderPhase() {
    updateHUD();
    const area = document.getElementById('content-area');

    if (state.assets <= 0 || state.hp <= 0) {
      stopTimer();
      area.innerHTML = `
        <div style="text-align:center; padding: 20px;">
          <h2 class="red" style="font-size: 1.8rem; margin-bottom: 10px;">💀 你爆倉破產 / 精神崩潰了！</h2>
          <p style="font-size:1.05rem;">最終存活天數：<b>${state.day}</b> 天</p>
          <p style="font-size:1.05rem;">最終獲取稱號：<span class="title-badge">${calculateTitle()}</span></p>
          <p style="color:#aaa; margin: 20px 0;">「股市沒有新鮮事，只有被韭菜淹沒的歷史。」</p>
          <button class="btn btn-next" onclick="submitScore()">🏆 上傳成績至全台排行榜</button>
          <button class="btn btn-danger" onclick="confirmResetGame()" style="margin-top:10px;">🔄 重新開始韭菜人生</button>
        </div>
      `;
      return;
    }

    if (state.phase === 'INIT_STORY') {
      area.innerHTML = `
        <div class="story-box">
          <p style="font-size: 1rem; font-weight: bold; margin-top: 0;">📖 散戶背景設定：</p>
          <p style="font-size:0.95rem; line-height: 1.6;">${state.currentStory}</p>
        </div>
        <div style="margin-bottom: 15px;">
          <label style="font-size: 0.9rem; color: #ffd54f;">✍️ 請輸入你的散戶代號（用於排行榜展示）：</label>
          <input type="text" id="setup-name" placeholder="例如：信義區當沖王" value="${state.playerName}">
        </div>
        <button class="btn btn-next" onclick="startGameWithStory()">🚀 簽署風險預告書，進入台股市場！</button>
      `;
      return;
    }

    if (state.phase === 'OPEN') {
      if (!state.currentEnv) {
        state.currentEnv = generateDynamicEnvironment(
          state.pendingTacticalChoice ? state.pendingTacticalChoice.targetType : null,
          state.afterMarketData,
          state.pendingTacticalChoice
        );
        state.pendingTacticalChoice = null;
        
        const changeVal = Math.round(state.taiex * state.currentEnv.changeRate);
        state.taiex += changeVal;
      }

      let tacticalReportHtml = '';
      if (state.openingTacticalReport) {
        const isWin = state.openingTacticalReport.isWin;
        tacticalReportHtml = `
          <div style="background:#222430; border:1px solid #ff9800; padding:8px 12px; border-radius:4px; margin-bottom:10px; font-size:0.85rem;">
            🎯 昨夜戰術【<b>${state.openingTacticalReport.name}</b>】開盤驗證結果：
            <span class="${isWin ? 'red' : 'green'}">${isWin ? '✅ 成功掌握盤勢！' : '❌ 盤勢出乎預期！'}</span>
          </div>
        `;
      }

      area.innerHTML = `
        ${tacticalReportHtml}
        <div class="market-info">
          <div>📊 開盤環境：<b>${state.currentEnv.name}</b></div>
          <div>大盤預估幅度：<span class="${state.currentEnv.type === 'up' ? 'red' : 'green'}">${state.currentEnv.change}</span></div>
        </div>
        <div class="news">📰 <b>早盤市場頭條：</b>${state.news || state.currentEnv.news}</div>
        <p style="font-size:0.9rem; color:#ffd54f; margin-bottom: 8px;">⏱️ 9:00 開盤秒殺！請在 10 秒內選擇你的早盤操作策略：</p>
        <button class="btn" onclick="handleChoice('CASH')">💵 現股買進 (穩健建倉，80% 資金)</button>
        <button class="btn" onclick="handleChoice('MARGIN')">⚡ 融資槓桿 (極速開槓，200% 資金)</button>
        <button class="btn" onclick="handleChoice('DAY_TRADE')">🔥 無本當沖 (當日平倉，挑戰暴利)</button>
        <button class="btn" onclick="handleChoice('HOLD')">🙈 觀望空手 (手握現金，看戲最舒服)</button>
      `;

      startTimer(10, () => handleChoice('HOLD'));
      return;
    }

    if (state.phase === 'MID') {
      if (!state.currentMidEnv) {
        state.currentMidEnv = generateDynamicMidEnvironment();
        const changeVal = Math.round(state.taiex * state.currentMidEnv.changeRate);
        state.taiex += changeVal;
      }

      area.innerHTML = `
        <div class="market-info">
          <div>📊 午盤走勢：<b>${state.currentMidEnv.name}</b></div>
          <div>午盤震盪：<span class="${state.currentMidEnv.type === 'up' ? 'red' : 'green'}">${state.currentMidEnv.change}</span></div>
        </div>
        <div class="news">📰 <b>盤中即時速報：</b>${state.currentMidEnv.news}</div>
        <p style="font-size:0.9rem; color:#ffd54f; margin-bottom: 8px;">⏱️ 12:30 盤中急促變化！請在 10 秒內做出午盤調整：</p>
        <button class="btn" onclick="handleChoice('HOLD')">堅守不出 (繼續持有，與主力對賭)</button>
        <button class="btn" onclick="handleChoice('TAKE_PROFIT')">落袋為安 (部分獲利入袋/落跑平倉)</button>
        <button class="btn" onclick="handleChoice('DOUBLE_DOWN')">加碼凹單 (跌越深買越多，攤平戰術)</button>
      `;

      startTimer(10, () => handleChoice('HOLD'));
      return;
    }

    if (state.phase === 'AFTER') {
      const divInfo = state.lastDividendInfo;
      let dividendHtml = '';
      if (divInfo && divInfo.perShare > 0) {
        if (!divInfo.missed) {
          dividendHtml = `
            <div class="dividend-box">
              🎁 <b>【除權息利多通知】</b> 本日發放每股 <b>$${divInfo.perShare}</b> 元現金股利！<br>
              💰 現金股利入帳：<b style="color:#69f0ae;">+$${divInfo.totalDividend.toLocaleString()}</b> 元！<br>
              ${divInfo.hpGain > 0 ? `🧠 股利發放慰藉心靈，HP 獲得恢復 <b style="color:#69f0ae;">+${divInfo.hpGain}%</b>！` : ''}
            </div>
          `;
        } else {
          dividendHtml = `
            <div class="story-box" style="border-color:#ff9800; color:#ffe0b2;">
              ⚠️ <b>【錯過除權息】</b> 本日發放每股 <b>$${divInfo.perShare}</b> 元現金股利！<br>
              😭 殘念！因你今日空手未持股，眼睜睜看著別人爽領股利！<br>
              🧠 心理極度不爽，HP 受到內傷 <b class="green">-5.0%</b>！
            </div>
          `;
        }
      }

      const g = state.afterMarketData;
      const formatGl = (item) => `<span class="${item.color}">${item.price} (${item.pct})</span>`;

      const dayProfit = state.assets - state.startDayAssets;
      const profitSign = dayProfit >= 0 ? '+' : '';
      const profitColor = dayProfit >= 0 ? 'red' : 'green';
      const profitPct = ((dayProfit / Math.max(state.startDayAssets, 1)) * 100).toFixed(1);

      const hpChangeSign = state.lastDayHpChange >= 0 ? '+' : '';
      const hpChangeColor = state.lastDayHpChange >= 0 ? 'red' : 'green';

      area.innerHTML = `
        <div class="settlement-card">
          <h3 style="margin-top:0; color:#ffd54f; border-bottom:1px solid #444; padding-bottom:6px;">📊 Day ${state.day} 每日盤後對帳單</h3>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:0.9rem;">
            <div>今日資產損益：<b class="${profitColor}">${profitSign}$${dayProfit.toLocaleString()} (${profitSign}${profitPct}%)</b></div>
            <div>今日交易手續費+稅：<b>$${state.lastFeeCost.toLocaleString()}</b></div>
            <div>期末總資產：<b>$${state.assets.toLocaleString()}</b></div>
            <div>心理承受 (HP)：<b class="${hpChangeColor}">${state.hp.toFixed(1)}% (${hpChangeSign}${state.lastDayHpChange.toFixed(1)}%)</b></div>
          </div>
        </div>

        ${dividendHtml}

        <p style="font-size:0.88rem; color:#ffd54f; margin-bottom:6px;">🌐 國際市場盤後數據 (夜盤/美股)：</p>
        <div class="global-market-grid">
          <div class="market-card"><div class="title">美股道瓊</div><div>${formatGl(g.dow)}</div></div>
          <div class="market-card"><div class="title">標普 500</div><div>${formatGl(g.sp500)}</div></div>
          <div class="market-card"><div class="title">費城半導體</div><div>${formatGl(g.sox)}</div></div>
          <div class="market-card"><div class="title">黃金 (USD)</div><div>${formatGl(g.gold)}</div></div>
          <div class="market-card"><div class="title">美元/台幣</div><div>${formatGl(g.usdt)}</div></div>
          <div class="market-card"><div class="title">比特幣 (BTC)</div><div>${formatGl(g.btc)}</div></div>
        </div>

        <p style="font-size:0.9rem; color:#ffd54f; margin-bottom: 8px;">🎯 請選擇夜盤戰術部署（將影響明日開盤環境）：</p>
        <button class="btn" onclick="handleTacticalChoice('TAIEX_UP')">🚀 部署「明日台股多頭續衝」戰術 (押注美股大漲)</button>
        <button class="btn" onclick="handleTacticalChoice('TAIEX_DOWN')">📉 部署「明日空頭大反撲」戰術 (避險避開避雷)</button>
        <button class="btn" onclick="handleTacticalChoice('HEDGE_GOLD_USD')">🛡️ 部署「黃金/美元動態避險」戰術 (降低國際盤連動衝擊)</button>
        <button class="btn" onclick="handleTacticalChoice('HEDGE_BTC')">🪙 部署「BTC風險資產聯動」戰術 (博取高風險波動收益)</button>
      `;
      return;
    }
  }

  // 初始化遊戲與自動讀取存檔
  window.addEventListener('DOMContentLoaded', () => {
    const hasSave = loadGame();
    if (hasSave) {
      if (confirm('偵測到您有上次存檔，是否繼續遊玩？\n(點擊「取消」將開始新遊戲)')) {
        switchTab(state.currentTab || 'history');
        renderPhase();
        return;
      } else {
        clearSaveData();
      }
    }
    resetToDayOne();
  });
</script></body></html>
