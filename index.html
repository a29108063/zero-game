    let pool = [...baseEnvironments, ...historicalEnvironments, ...breakingNewsEnvironments];
    
    // 計算國際市場綜合情緒偏向 (以道瓊、費半、比特幣為主)
    let globalBias = 0; // 正數代表偏多，負數代表偏空
    if (globalMarket) {
      globalBias += (globalMarket.dow.rawPct || 0);
      globalBias += (globalMarket.sox.rawPct || 0) * 1.5; // 半導體對台股影響更大
      globalBias += (globalMarket.btc.rawPct || 0) * 0.5;
    }

    // 若玩家前一日有下達戰術，強制微調方向或勝率
    let tacticalReport = null;
    if (tacticalChoice) {
      const isTacticsSuccess = Math.random() < 0.6; // 60% 戰術命中率
      if (tacticalChoice.type === 'TAIEX_UP') {
        if (isTacticsSuccess) targetType = 'up';
      } else if (tacticalChoice.type === 'TAIEX_DOWN') {
        if (isTacticsSuccess) targetType = 'down';
      } else if (tacticalChoice.type === 'HEDGE_GOLD_USD') {
        // 黃金避險成功可抵銷部分空頭傷害
        if (globalBias < 0) globalBias *= 0.5;
      }
      tacticalReport = {
        name: tacticalChoice.tacticsName,
        isWin: isTacticsSuccess
      };
      state.openingTacticalReport = tacticalReport;
    } else {
      state.openingTacticalReport = null;
    }

    if (targetType) {
      pool = pool.filter(e => e.type === targetType);
    } else {
      // 根據國際綜合情緒自動決定偏多還偏空
      const autoType = globalBias >= 0 ? 'up' : 'down';
      // 將國際盤勢情緒融入機率：若國際大好，拉高多頭事件權重
      pool = pool.map(e => {
        let weight = e.weightBonus || 1;
        if (e.type === autoType) weight *= 2.2;
        return { ...e, calculatedWeight: weight };
      });
    }

    // 依據加權抽樣
    let selectedEv;
    if (!targetType && globalMarket) {
      let totalWeight = pool.reduce((sum, item) => sum + (item.calculatedWeight || 1), 0);
      let randomVal = Math.random() * totalWeight;
      let currentSum = 0;
      for (let item of pool) {
        currentSum += (item.calculatedWeight || 1);
        if (randomVal <= currentSum) {
          selectedEv = item;
          break;
        }
      }
    }
    if (!selectedEv) {
      selectedEv = getRandomChoice(pool);
    }

    const isUp = selectedEv.type === 'up';
    // 讓國際盤幅的大小微調當日台股變動幅度
    let basePctFactor = Math.abs(globalBias) > 2 ? 1.5 : 1.0;
    const pctValue = parseFloat(((Math.random() * 3.5 + 0.5) * basePctFactor).toFixed(1));

    return {
      name: selectedEv.name,
      type: selectedEv.type,
      news: selectedEv.news + (globalMarket ? ` (因今日國際盤勢連動：${globalBias >= 0 ? '外資信心回穩' : '國際利空壓抑'})` : ''),
      dividendChance: selectedEv.dividendChance ?? 0.15,
      dividendMultiplier: selectedEv.dividendMultiplier ?? 1.0,
      changeRate: isUp ? (pctValue / 100) : (-pctValue / 100),
      change: `${isUp ? '+' : '-'}${pctValue}%`
    };
  }

  function generateDynamicMidEnvironment() {
    const isUp = Math.random() < 0.5;
    const pctValue = parseFloat((Math.random() * 4.9 + 0.1).toFixed(1));
    const ev = getRandomChoice(midEnvironments);
    return {
      name: ev.name,
      type: isUp ? 'up' : 'down',
      news: ev.news,
      changeRate: isUp ? (pctValue / 100) : (-pctValue / 100),
      change: `${isUp ? '+' : '-'}${pctValue}%`
    };
  }

  let state = getInitialState();

  function getInitialState() {
    return {
      day: 1,
      assets: 1000000,
      startDayAssets: 1000000,
      shares: 0,
      hp: 100,
      startDayHp: 100,
      taiex: 40000,
      startDayTaiex: 40000,
      phase: 'INIT_STORY',
      currentStory: getRandomChoice(storyPool),
      playerName: '',
      currentEnv: null,
      currentMidEnv: null,
      afterMarketData: generateAfterMarketData(), // 初始化第一日國際盤
      pendingTacticalChoice: null,
      openingTacticalReport: null,
      todayTacticalLog: null,
      timer: null,
      timeLeft: 10,
      dailyLog: [],
      dayTradeCount: 0,
      currentTab: 'history',
      assignedGameOverTitle: null,
      lastFeeCost: 0,
      lastDividendInfo: null,
      lastDividendDay: -10
    };
  }

  function resetToDayOne() {
    state = getInitialState();
    switchTab('history');
    renderPhase();
  }

  function calculateTitle() {
    const profitRate = ((state.assets - 1000000) / 1000000) * 100;
    if (state.assets <= 0 || state.hp <= 0) {
      if (!state.assignedGameOverTitle) state.assignedGameOverTitle = getRandomChoice(gameOverTitles);
      return state.assignedGameOverTitle;
    }
    if (profitRate <= -30) return '【台南反指標】';
    if (profitRate <= -15 && state.hp < 40) return '【股市冥燈】';
    if (profitRate >= 60) return '【哲哲接班人】';
    if (profitRate >= 30) return '【台股少年股神】';
    if (profitRate >= 10) return '【波段操盤大師】';
    if (state.dayTradeCount >= 3) return '【極限當沖賭王】';
    if (state.day >= 10) return '【資深股市生還者】';
    if (profitRate < 0) return '【韭菜熟成中】';
    return '【台股新星散戶】';
  }

  function startTimer(seconds, onTimeout) {
    clearInterval(state.timer);
    state.timeLeft = seconds;
    const timerBox = document.getElementById('timer-box');
    const timerSec = document.getElementById('timer-sec');
    if (timerBox) timerBox.style.display = 'block';
    if (timerSec) timerSec.innerText = state.timeLeft;

    state.timer = setInterval(() => {
      state.timeLeft--;
      if (timerSec) timerSec.innerText = state.timeLeft;
      if (state.timeLeft <= 0) {
        clearInterval(state.timer);
        onTimeout();
      }
    }, 1000);
  }

  function stopTimer() {
    clearInterval(state.timer);
    const timerBox = document.getElementById('timer-box');
    if (timerBox) timerBox.style.display = 'none';
  }

  function updateHUD() {
    document.getElementById('assets').innerText = Math.max(0, state.assets).toLocaleString();
    document.getElementById('shares').innerText = state.shares.toLocaleString();
    document.getElementById('hp').innerText = Math.max(0, state.hp).toFixed(1);
    document.getElementById('day').innerText = state.day;
    document.getElementById('title-badge').innerText = calculateTitle();

    const taiexHud = document.getElementById('taiex-hud');
    const taiexDiff = state.taiex - state.startDayTaiex;
    const taiexSign = taiexDiff >= 0 ? '+' : '';
    const taiexColor = taiexDiff >= 0 ? 'red' : 'green';
    taiexHud.innerHTML = `<span class="${taiexColor}">${state.taiex.toLocaleString()} (${taiexSign}${taiexDiff})</span>`;
  }

  window.switchTab = function(tab) {
    state.currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (tab === 'history') {
      document.getElementById('btn-tab-history').classList.add('active');
      document.getElementById('sidebar-tab-title').innerText = '📜 每日對帳歷史';
      renderHistory();
    } else {
      document.getElementById('btn-tab-leaderboard').classList.add('active');
      document.getElementById('sidebar-tab-title').innerText = '🏆 全台散戶排行榜';
      renderLeaderboard();
    }
  };

  function renderHistory() {
    const container = document.getElementById('sidebar-content');
    if (state.dailyLog.length === 0) {
      container.innerHTML = `<div style="color:#888;text-align:center;margin-top:20px;">尚無結算紀錄</div>`;
      return;
    }
    container.innerHTML = state.dailyLog.map(item => {
      const diffColor = item.profit >= 0 ? 'red' : 'green';
      const sign = item.profit >= 0 ? '+' : '';
      const openColor = item.openType === 'up' ? 'red' : 'green';
      const midColor = item.midType === 'up' ? 'red' : 'green';

      return `
        <div class="history-card">
          <div class="day-header">
            <span>Day ${item.day} ${item.env}</span>
            <span class="${diffColor}">${sign}$${item.profit.toLocaleString()} (${sign}${item.pct}%)</span>
          </div>
          <div class="history-grid">
            <div>開盤/午盤走勢：</div>
            <div>
              <span class="${openColor}">開盤 ${item.openChange || '--'}</span> / 
              <span class="${midColor}">午盤 ${item.midChange || '--'}</span>
            </div>
            <div>大盤收盤：</div><div>${item.taiexEnd.toLocaleString()} (${item.taiexPct})</div>
            <div>剩餘持股：</div><div>${item.shares.toLocaleString()} 股</div>
            <div>手續費+稅：</div><div>$${(item.fee || 0).toLocaleString()}</div>
            ${item.dividend ? `<div>🎁 股利入帳：</div><div style="color: #69f0ae;">+$${item.dividend.toLocaleString()}</div>` : ''}
            ${item.tacticalReport ? `<div style="color: #ffd54f; grid-column: span 2;">🎯 戰術結果：${item.tacticalReport}</div>` : ''}
            <div style="color: #e0e0e0; font-weight: bold;">期末資產：</div><div style="color: #e0e0e0; font-weight: bold;">$${item.endAssets.toLocaleString()}</div>
          </div>
        </div>
      `;
    }).slice().reverse().join('');
  }

  async function renderLeaderboard() {
    const container = document.getElementById('sidebar-content');
    container.innerHTML = `<div style="color:#888;text-align:center;margin-top:20px;">載入排行榜數據中...</div>`;

    let board = [];
    try {
      const res = await fetch('/api/leaderboard');
      if (res.ok) {
        board = await res.json();
      } else {
        throw new Error('無 API 支援');
      }
    } catch (err) {
      const localData = localStorage.getItem('stock_sim_leaderboard');
      if (localData) {
        board = JSON.parse(localData);
      } else {
        board = [...defaultLeaderboard];
        localStorage.setItem('stock_sim_leaderboard', JSON.stringify(board));
      }
    }

    if (!board || board.length === 0) {
      container.innerHTML = `<div style="color:#888;text-align:center;margin-top:20px;">全台尚無榜單記錄</div>`;
      return;
    }

    board.sort((a, b) => b.days - a.days);

    container.innerHTML = board.map((item, idx) => `
      <div class="leaderboard-item">
        <div><b>#${idx + 1} ${item.name}</b><br><small style="color:#aaa;">${item.title || '台股散戶'}</small></div>
        <div style="text-align:right;"><span class="red">${item.days} 天</span><br><small>$${(item.assets || 0).toLocaleString()}</small></div>
      </div>
    `).join('');
  }

  window.startGameWithStory = function() {
    const nameInput = document.getElementById('setup-name').value.trim();
    if (!nameInput) {
      alert('請先輸入你的散戶代號才能進入市場！');
      return;
    }
    state.playerName = nameInput;
    state.phase = 'OPEN';
    renderPhase();
  };

  window.submitScore = async function() {
    const scoreData = {
      name: state.playerName || '無名韭菜',
      days: state.day,
      assets: state.assets,
      title: calculateTitle(),
      timestamp: Date.now()
    };

    let isRemoteSuccess = false;
    try {
      const res = await fetch('/api/leaderboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(scoreData)
      });
      if (res.ok) isRemoteSuccess = true;
    } catch (error) {
      isRemoteSuccess = false;
    }

    const localData = localStorage.getItem('stock_sim_leaderboard');
    let board = localData ? JSON.parse(localData) : [...defaultLeaderboard];
    board.push(scoreData);
    board.sort((a, b) => b.days - a.days);
    localStorage.setItem('stock_sim_leaderboard', JSON.stringify(board));

    alert(isRemoteSuccess ? '🎉 成功登錄全台雲端排行榜！' : '🎉 成績已成功登錄至本地排行榜！');
    switchTab('leaderboard');
  };

  function checkDividendPayout() {
    let isDividendDay = false;
    let isCoolingDown = false;

    if (state.lastDividendDay === -10) {
      if (state.day === 5) {
        isDividendDay = true;
      } else {
        isCoolingDown = true;
      }
    } else {
      const daysSinceLastDividend = state.day - state.lastDividendDay;
      isCoolingDown = daysSinceLastDividend < 10;
      const chance = state.currentEnv ? state.currentEnv.dividendChance : 0.15;
      isDividendDay = !isCoolingDown && (Math.random() < chance);
    }

    const multiplier = state.currentEnv ? state.currentEnv.dividendMultiplier : 1.0;

    if (isDividendDay) {
      state.lastDividendDay = state.day;
      let rawPerShare = (Math.random() * 4.0 + 0.8) * multiplier;
      const dividendPerShare = parseFloat(Math.max(0.8, rawPerShare).toFixed(1));

      if (state.shares > 0) {
        const totalDividend = Math.round(state.shares * dividendPerShare);
        state.assets += totalDividend;
        
        let hpGainPct = 0;
        if (state.hp < 100) {
          const baseRatio = Math.min(totalDividend / 50000, 1.0);
          hpGainPct = getRandomFloat(4.0, 12.0, 1) * multiplier * (1 + baseRatio * 0.5);
          hpGainPct = Math.min(hpGainPct, 100 - state.hp);
          state.hp = Math.min(100, state.hp + hpGainPct);
        }

        state.lastDividendInfo = {
          perShare: dividendPerShare,
          totalDividend: totalDividend,
          missed: false,
          hpGain: parseFloat(hpGainPct.toFixed(1)),
          coolingDown: false
        };
      } else {
        state.lastDividendInfo = {
          perShare: dividendPerShare,
          totalDividend: 0,
          missed: true,
          hpGain: 0,
          coolingDown: false
        };
        state.hp = Math.max(0, state.hp - 5);
      }
    } else {
      state.lastDividendInfo = {
        perShare: 0,
        totalDividend: 0,
        missed: false,
        hpGain: 0,
        coolingDown: isCoolingDown
      };
    }
  }

  function handleChoice(actionType) {
    stopTimer();
    const env = state.phase === 'OPEN' ? state.currentEnv : state.currentMidEnv;
    const isUpEnv = env.type === 'up';
    let pnlRate = 0;
    let feeRate = 0;
    let hpImpactPct = 0;

    if (actionType === 'CASH') {
      const win = Math.random() < (isUpEnv ? 0.55 : 0.42);
      pnlRate = win ? getRandomFloat(0.03, 0.08, 3) : -getRandomFloat(0.02, 0.06, 3);
      feeRate = 0.0044;
      state.shares = Math.floor((state.assets * 0.8) / (state.taiex / 1000));
    } else if (actionType === 'MARGIN') {
      const win = Math.random() < (isUpEnv ? 0.48 : 0.32);
      pnlRate = win ? getRandomFloat(0.10, 0.20, 3) : -getRandomFloat(0.08, 0.16, 3);
      feeRate = 0.0060;
      state.shares = Math.floor((state.assets * 2.0) / (state.taiex / 1000));
    } else if (actionType === 'DAY_TRADE') {
      state.dayTradeCount++;
      const win = Math.random() < (isUpEnv ? 0.35 : 0.22);
      pnlRate = win ? getRandomFloat(0.25, 0.50, 3) : -getRandomFloat(0.20, 0.45, 3);
      feeRate = 0.0029;
      state.shares = 0;
    } else if (actionType === 'HOLD') {
      const win = Math.random() < (isUpEnv ? 0.45 : 0.30);
      pnlRate = win ? getRandomFloat(0.05, 0.12, 3) : -getRandomFloat(0.04, 0.10, 3);
    } else if (actionType === 'TAKE_PROFIT') {
      const cutRatio = getRandomFloat(0.3, 0.8, 2);
      state.shares = Math.floor(state.shares * (1 - cutRatio));
      pnlRate = -0.01;
      hpImpactPct = 5.0;
    } else if (actionType === 'DOUBLE_DOWN') {
      const win = Math.random() < (isUpEnv ? 0.28 : 0.15);
      pnlRate = win ? getRandomFloat(0.20, 0.40, 3) : -getRandomFloat(0.15, 0.35, 3);
      feeRate = 0.0044;
      state.shares *= 2;
    }

    const feeCost = Math.round(state.assets * feeRate);
    const pnlAmount = Math.round(state.assets * pnlRate) - feeCost;
    state.assets += pnlAmount;
    state.lastFeeCost += feeCost;

    if (pnlAmount < 0) {
      hpImpactPct += Math.max(-20, Math.floor(pnlAmount / 35000));
    } else {
      hpImpactPct += Math.min(15, Math.floor(pnlAmount / 40000));
    }
    state.hp = Math.max(0, Math.min(100, state.hp + hpImpactPct));

    if (state.phase === 'OPEN') {
      state.phase = 'MID';
    } else if (state.phase === 'MID') {
      state.phase = 'AFTER';
      checkDividendPayout();
      state.afterMarketData = generateAfterMarketData();
      recordDailyLog();
    }
    renderPhase();
  }

  function handleTacticalChoice(choice) {
    let targetType = 'up';
    let tacticsName = '';

    if (choice === 'TAIEX_UP') {
      tacticsName = '明日台股多頭續衝';
      targetType = 'up';
    } else if (choice === 'TAIEX_DOWN') {
      tacticsName = '明日空頭大反撲';
      targetType = 'down';
    } else if (choice === 'HEDGE_GOLD_USD') {
      tacticsName = '黃金/美元動態避險';
      targetType = Math.random() < 0.5 ? 'up' : 'down';
    } else if (choice === 'HEDGE_BTC') {
      tacticsName = 'BTC風險資產聯動';
      targetType = Math.random() < 0.6 ? 'up' : 'down';
    }

    state.pendingTacticalChoice = {
      type: choice,
      targetType: targetType,
      tacticsName: tacticsName
    };

    state.todayTacticalLog = `【${tacticsName}】已部署，待明日開盤結算`;

    state.day++;
    state.phase = 'OPEN';
    state.currentEnv = null;
    state.currentMidEnv = null;
    state.lastFeeCost = 0;
    state.startDayTaiex = state.taiex;
    state.startDayAssets = state.assets;
    state.startDayHp = state.hp;
    renderPhase();
  }

  function recordDailyLog() {
    const existingIndex = state.dailyLog.findIndex(l => l.day === state.day);

    const profit = state.assets - state.startDayAssets;
    const pct = ((profit / state.startDayAssets) * 100).toFixed(1);
    const taiexDiffTotal = state.taiex - state.startDayTaiex;
    const taiexPctTotal = ((taiexDiffTotal / state.startDayTaiex) * 100).toFixed(2);

    const logData = {
      day: state.day,
      env: state.currentEnv ? state.currentEnv.name : '',
      openType: state.currentEnv ? state.currentEnv.type : 'up',
      openChange: state.currentEnv ? state.currentEnv.change : '0%',
      midType: state.currentMidEnv ? state.currentMidEnv.type : 'up',
      midChange: state.currentMidEnv ? state.currentMidEnv.change : '0%',
      profit: profit,
      pct: pct,
      taiexEnd: state.taiex,
      taiexPct: `${taiexDiffTotal >= 0 ? '+' : ''}${taiexPctTotal}%`,
      shares: state.shares,
      fee: state.lastFeeCost,
      dividend: state.lastDividendInfo && !state.lastDividendInfo.coolingDown ? state.lastDividendInfo.totalDividend : 0,
      tacticalReport: state.openingTacticalReport ? `${state.openingTacticalReport.name} (${state.openingTacticalReport.isWin ? '成功' : '失敗'})` : null,
      endAssets: state.assets
    };

    if (existingIndex !== -1) {
      state.dailyLog[existingIndex] = logData;
    } else {
      state.dailyLog.push(logData);
    }

    if (state.currentTab === 'history') renderHistory();
  }

  function renderPhase() {
    if (state.assets <= 0 || state.hp <= 0) {
      stopTimer();
      const finalTitle = calculateTitle();
      const area = document.getElementById('content-area');
      area.innerHTML = `
        <div style="text-align: center; padding: 20px 10px;">
          <h2 class="red" style="font-size: 1.8rem; margin-top: 0;">💥 慘遭斷頭！韭菜畢業宣告 💥</h2>
          <p style="font-size: 1rem; color: #ffccbc;">你在台股戰場生存了 <b style="color:#ffd54f;">${state.day}</b> 天，最終宣告破產退場。</p>
          <div class="settlement-card" style="margin: 20px auto; max-width: 400px; text-align: left;">
            <div style="margin-bottom: 8px;">🏷️ 獲得稱號：<span class="title-badge">${finalTitle}</span></div>
            <div style="margin-bottom: 8px;">💰 剩餘資產：<span class="red">$${Math.max(0, state.assets).toLocaleString()}</span></div>
            <div style="margin-bottom: 8px;">🧠 最終精神 (HP)：<span class="red">${Math.max(0, state.hp).toFixed(1)}%</span></div>
            <div>📦 剩餘庫存：<span>${state.shares.toLocaleString()} 股</span></div>
          </div>
          <button class="btn btn-next" onclick="submitScore()" style="margin-bottom: 10px;">🏆 登錄成績至排行榜</button>
          <button class="btn btn-danger" onclick="resetToDayOne()">🔄 重新投胎再戰台股</button>
        </div>
      `;
      updateHUD();
      return;
    }

    const area = document.getElementById('content-area');

    if (state.phase === 'INIT_STORY') {
      stopTimer();
      area.innerHTML = `
        <div style="padding: 10px 0;">
          <h3 style="color:#ffd54f; margin-top:0;">📖 身世背景生成</h3>
          <div class="story-box">${state.currentStory}</div>
          <label style="font-size:0.9rem; color:#aaa;">請輸入你的散戶代號：</label>
          <input type="text" id="setup-name" placeholder="例如：信義區當沖狂魔" value="少年股神">
          <button class="btn btn-next" onclick="startGameWithStory()">▶️ 帶著 100 萬積蓄闖蕩台股</button>
        </div>
      `;
      return;
    }

    if (state.phase === 'OPEN') {
      if (!state.currentEnv) {
        // 帶入國際市場數據對隔日開盤進行加權
        state.currentEnv = generateDynamicEnvironment(null, state.afterMarketData, state.pendingTacticalChoice);
        state.pendingTacticalChoice = null;
        
        const changeFloat = parseFloat(state.currentEnv.changeRate);
        const indexShift = Math.round(state.taiex * changeFloat);
        state.taiex += indexShift;
      }

      updateHUD();
      startTimer(10, () => handleChoice('CASH'));

      let tacticalReportHtml = '';
      if (state.openingTacticalReport) {
        const r = state.openingTacticalReport;
        tacticalReportHtml = `<div style="margin-bottom:10px; font-size:0.85rem; color:${r.isWin ? '#69f0ae' : '#ff5252'};">🎯 昨日戰術【${r.name}】結算：<b>${r.isWin ? '戰術成功，獲得額外加成！' : '遭到主力逆勢狙擊，判定失敗！'}</b></div>`;
      }

      area.innerHTML = `
        <div>
          ${tacticalReportHtml}
          <div class="market-info">
            <span>🌅 <b>盤前開盤快訊</b>：${state.currentEnv.name}</span>
            <span class="${state.currentEnv.type === 'up' ? 'red' : 'green'}">${state.currentEnv.change}</span>
          </div>
          <div class="news">💬 <b>市場消息</b>：${state.currentEnv.news}</div>
          <div style="font-size: 0.9rem; margin-bottom: 8px; color: #ffd54f;">請選擇您的開盤因應策略：</div>
          <button class="btn" onclick="handleChoice('CASH')">📈 <b>現股常規壓身</b> (穩健布局權值股，勝率適中)</button>
          <button class="btn" onclick="handleChoice('MARGIN')">⚡ <b>融資開槓桿 ALL IN</b> (融資 2 倍放大，高報酬高風險)</button>
          <button class="btn" onclick="handleChoice('DAY_TRADE')">🔥 <b>無本當沖盲狙</b> (極速搓合，手續費低但隨時準備畢業)</button>
        </div>
      `;
      return;
    }

    if (state.phase === 'MID') {
      if (!state.currentMidEnv) {
        state.currentMidEnv = generateDynamicMidEnvironment();
        const changeFloat = parseFloat(state.currentMidEnv.changeRate);
        const indexShift = Math.round(state.taiex * changeFloat);
        state.taiex += indexShift;
      }

      updateHUD();
      startTimer(10, () => handleChoice('HOLD'));

      area.innerHTML = `
        <div>
          <div class="market-info">
            <span>⚡ <b>午盤戰局變動</b>：${state.currentMidEnv.name}</span>
            <span class="${state.currentMidEnv.type === 'up' ? 'red' : 'green'}">${state.currentMidEnv.change}</span>
          </div>
          <div class="news">💬 <b>盤中實況</b>：${state.currentMidEnv.news}</div>
          <div style="font-size: 0.9rem; margin-bottom: 8px; color: #ffd54f;">午盤風雲變色，請立即採取動作：</div>
          <button class="btn" onclick="handleChoice('HOLD')">🛡️ <b>抱股緊抱不放</b> (維持現狀，靜觀其變)</button>
          <button class="btn" onclick="handleChoice('TAKE_PROFIT')">💰 <b>逢高獲利了結 / 停損砍倉</b> (部分持股落袋為安，恢復心態)</button>
          <button class="btn" onclick="handleChoice('DOUBLE_DOWN')">🚀 <b>凹單加碼攤平</b> (賭盤勢反轉，持股翻倍)</button>
        </div>
      `;
      return;
    }

    if (state.phase === 'AFTER') {
      stopTimer();
      updateHUD();

      const profit = state.assets - state.startDayAssets;
      const pct = ((profit / state.startDayAssets) * 100).toFixed(1);
      const isProfitable = profit >= 0;
      const m = state.afterMarketData;

      let dividendHtml = '';
      if (state.lastDividendInfo) {
        const info = state.lastDividendInfo;
        if (info.coolingDown) {
          dividendHtml = `<div class="dividend-box">🎁 <b>除權息季通知</b>：目前距離上次領息保護期中，今日無股利發放。</div>`;
        } else if (info.missed) {
          dividendHtml = `<div class="dividend-box" style="border-color:#ff5252; color:#ffccbc;">🎁 <b>除權息入帳通知</b>：今日為優質個股除權息日！但您<b>未持有任何庫存</b>，錯失領取每股 $${info.perShare} 股利的機會，心態小幅炸裂 (-5% HP)！</div>`;
        } else if (info.totalDividend > 0) {
          dividendHtml = `<div class="dividend-box">🎁 <b>股利順利入帳</b>：持股參與除權息成功！每股配發 $<b>${info.perShare}</b>，共領取現金股利 <span class="red">+$${info.totalDividend.toLocaleString()}</span>！精神恢復 +${info.hpGain}%！</div>`;
        } else {
          dividendHtml = `<div class="dividend-box" style="color:#aaa;">🎁 今日非除權息發放日，股市平穩運作。</div>`;
        }
      }

      area.innerHTML = `
        <div>
          <h3 style="color:#ffd54f; margin-top:0;">📊 Day ${state.day} 收盤對帳單</h3>
          <div class="settlement-card">
            <div style="margin-bottom:6px;">本日損益：<span class="${isProfitable ? 'red' : 'green'}">${isProfitable ? '+' : ''}$${profit.toLocaleString()} (${isProfitable ? '+' : ''}${pct}%)</span></div>
            <div style="margin-bottom:6px;">手續費與證交稅開銷：<span style="color:#aaa;">$${state.lastFeeCost.toLocaleString()}</span></div>
            <div style="margin-bottom:6px;">收盤總資產：<b>$${state.assets.toLocaleString()}</b></div>
            <div>目前庫存部位：<span>${state.shares.toLocaleString()} 股</span></div>
          </div>

          ${dividendHtml}

          <div style="font-size: 0.85rem; color: #8be9fd; margin-bottom: 6px;">🌐 <b>國際金融市場收盤看板（將影響明日台股開盤加權）</b></div>
          <div class="global-market-grid">
            <div class="market-card">
              <div class="title">道瓊工業</div>
              <div>${m.dow.price}</div>
              <div class="${m.dow.color}">${m.dow.pct}</div>
            </div>
            <div class="market-card">
              <div class="title">標普 500</div>
              <div>${m.sp500.price}</div>
              <div class="${m.sp500.color}">${m.sp500.pct}</div>
            </div>
            <div class="market-card">
              <div class="title">費城半導體</div>
              <div>${m.sox.price}</div>
              <div class="${m.sox.color}">${m.sox.pct}</div>
            </div>
            <div class="market-card">
              <div class="title">黃金 (盎司)</div>
              <div>$${m.gold.price}</div>
              <div class="${m.gold.color}">${m.gold.pct}</div>
            </div>
            <div class="market-card">
              <div class="title">美元/台幣</div>
              <div>$${m.usdt.price}</div>
              <div class="${m.usdt.color}">${m.usdt.pct}</div>
            </div>
            <div class="market-card">
              <div class="title">比特幣</div>
              <div>$${m.btc.price}</div>
              <div class="${m.btc.color}">${m.btc.pct}</div>
            </div>
          </div>

          <div style="font-size: 0.9rem; margin-bottom: 8px; color: #ffd54f;">🎯 請擬定明日盤後戰術布局：</div>
          <button class="btn" onclick="handleTacticalChoice('TAIEX_UP')">🚀 <b>押注台股多頭續衝</b> (強化明日看多機率)</button>
          <button class="btn" onclick="handleTacticalChoice('TAIEX_DOWN')">📉 <b>押注空頭大反撲</b> (強化明日看空機率)</button>
          <button class="btn" onclick="handleTacticalChoice('HEDGE_GOLD_USD')">🛡️ <b>黃金/美元動態避險</b> (降低國際利空衝擊)</button>
          <button class="btn" onclick="handleTacticalChoice('HEDGE_BTC')">🪙 <b>BTC 風險資產聯動</b> (投機高風險高回報)</button>
        </div>
      `;
    }
  }

  // 初始化啟動
  renderPhase();
  switchTab('history');
</script></body></html>
